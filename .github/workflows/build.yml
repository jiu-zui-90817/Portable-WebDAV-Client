name: Dual Build Release - PyInstaller & Nuitka

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ========== 1. 前置测试（失败就终止，省时间） ==========
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install webdavclient3 requests
      # 如果你有测试文件，取消下面注释
      # - run: pytest

  # ========== 2. PyInstaller 打包 ==========
  build-pyinstaller:
    needs: test
    name: PyInstaller ${{ matrix.platform_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform_name: Windows_X64
            python_arch: x64
            file_ext: .exe
          - os: windows-latest
            platform_name: Windows_X86
            python_arch: x86
            file_ext: .exe
          - os: ubuntu-latest
            platform_name: Linux_X64
            python_arch: x64
            file_ext: ""
          - os: ubuntu-24.04-arm
            platform_name: Linux_ARM64
            file_ext: ""

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python (x86/x64)
        if: matrix.platform_name != 'Linux_ARM64'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.python_arch }}

      - name: Setup Python (ARM64)
        if: matrix.platform_name == 'Linux_ARM64'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk upx-ucl

      - name: Install UPX (Windows)
        if: runner.os == 'Windows'
        run: choco install upx

      - name: Install Python Libraries
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller webdavclient3 requests

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --onefile --noconsole `
            --name "Portable_WebDAV_Client_PyInstaller_${{ matrix.platform_name }}" `
            --icon=webdav.ico `
            portable_webdav_client_Pro.py

      - name: Build with PyInstaller (Linux)
        if: runner.os == 'Linux'
        run: |
          pyinstaller --onefile --noconsole \
            --name "Portable_WebDAV_Client_PyInstaller_${{ matrix.platform_name }}" \
            portable_webdav_client_Pro.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyInstaller-${{ matrix.platform_name }}
          path: dist/Portable_WebDAV_Client_PyInstaller_${{ matrix.platform_name }}${{ matrix.file_ext }}
          if-no-files-found: error

  # ========== 3. Nuitka 打包 ==========
  build-nuitka:
    needs: test
    name: Nuitka ${{ matrix.platform_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform_name: Windows_X64
            python_arch: x64
            file_ext: .exe
          - os: windows-latest
            platform_name: Windows_X86
            python_arch: x86
            file_ext: .exe
          - os: ubuntu-latest
            platform_name: Linux_X64
            python_arch: x64
            file_ext: ""
          - os: ubuntu-24.04-arm
            platform_name: Linux_ARM64
            file_ext: ""

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python (x86/x64)
        if: matrix.platform_name != 'Linux_ARM64'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.python_arch }}

      - name: Setup Python (ARM64)
        if: matrix.platform_name == 'Linux_ARM64'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-dev gcc upx-ucl

      - name: Install UPX (Windows)
        if: runner.os == 'Windows'
        run: choco install upx

      - name: Install Python Libraries
        run: |
          python -m pip install --upgrade pip
          pip install nuitka webdavclient3 requests

      - name: Build with Nuitka (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m nuitka `
            --onefile `
            --enable-plugin=tk-inter `
            --windows-disable-console `
            --windows-icon-from-ico=webdav.ico `
            --output-dir=dist `
            --output-filename=Portable_WebDAV_Client_Nuitka_${{ matrix.platform_name }} `
            --assume-yes-for-downloads `
            portable_webdav_client_Pro.py

      - name: Build with Nuitka (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m nuitka \
            --onefile \
            --enable-plugin=tk-inter \
            --output-dir=dist \
            --output-filename=Portable_WebDAV_Client_Nuitka_${{ matrix.platform_name }} \
            --assume-yes-for-downloads \
            portable_webdav_client_Pro.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nuitka-${{ matrix.platform_name }}
          path: dist/Portable_WebDAV_Client_Nuitka_${{ matrix.platform_name }}${{ matrix.file_ext }}
          if-no-files-found: error

  # ========== 4. 自动创建 Release 并上传 ==========
  release:
    needs: [build-pyinstaller, build-nuitka]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List Artifacts
        run: ls -la artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
