name: Multi Build Release - PyInstaller, Nuitka & Win7

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ========== 1. 前置测试（失败就终止，省时间） ==========
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install Python Libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Syntax Check
        run: python -m py_compile portable_webdav_client_Pro.py
      - name: Unit Tests
        run: python -m unittest discover -s tests -t . -v

  # ========== 1b. Windows 7 兼容性测试（Python 3.8） ==========
  test-win7:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8.10'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-win7.txt
      - name: Install Python Libraries
        run: |
          python -m pip install --upgrade 'pip<25'
          pip install -r requirements-win7.txt
      - name: Syntax Check
        run: python -m py_compile portable_webdav_client_Pro.py
      - name: Unit Tests
        run: python -m unittest discover -s tests -t . -v

  # ========== 2. PyInstaller 打包 ==========
  build-pyinstaller:
    needs: test
    name: PyInstaller ${{ matrix.platform_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform_name: Windows_X64
            python_arch: x64
            file_ext: .exe
          - os: windows-latest
            platform_name: Windows_X86
            python_arch: x86
            file_ext: .exe
          - os: ubuntu-24.04
            platform_name: Linux_X64
            python_arch: x64
            file_ext: ""
          - os: ubuntu-24.04-arm
            platform_name: Linux_ARM64
            file_ext: ""

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python (x86/x64)
        if: matrix.platform_name != 'Linux_ARM64'
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          architecture: ${{ matrix.python_arch }}

      - name: Setup Python (ARM64)
        if: matrix.platform_name == 'Linux_ARM64'
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk upx-ucl

      - name: Install UPX (Windows)
        if: runner.os == 'Windows'
        run: choco install upx

      - name: Install Python Libraries
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --onefile --noconsole `
            --name "Portable_WebDAV_Client_PyInstaller_${{ matrix.platform_name }}" `
            --icon=webdav.ico `
            --add-data "webdav.ico;." `
            --hidden-import=socks `
            portable_webdav_client_Pro.py

      - name: Build with PyInstaller (Linux)
        if: runner.os == 'Linux'
        run: |
          pyinstaller --onefile --noconsole \
            --name "Portable_WebDAV_Client_PyInstaller_${{ matrix.platform_name }}" \
            --add-data "webdav.ico:." \
            --hidden-import=socks \
            portable_webdav_client_Pro.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyInstaller-${{ matrix.platform_name }}
          path: dist/Portable_WebDAV_Client_PyInstaller_${{ matrix.platform_name }}${{ matrix.file_ext }}
          if-no-files-found: error
          retention-days: 14

  # ========== 2b. Windows 7 专用打包（Python 3.8 + PyInstaller） ==========
  # 说明：Nuitka 标准版只面向 Windows 10+，Win7 用户请使用这里的 PyInstaller 产物。
  build-win7:
    needs: test-win7
    name: PyInstaller Win7 ${{ matrix.platform_name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform_name: Windows7_X64
            python_arch: x64
          - platform_name: Windows7_X86
            python_arch: x86
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          architecture: ${{ matrix.python_arch }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-win7.txt
      - name: Install Python Libraries
        run: |
          python -m pip install --upgrade 'pip<25'
          pip install -r requirements-win7.txt
          pip install pyinstaller==6.18.0
      - name: Build with PyInstaller (Windows 7)
        run: |
          pyinstaller --onefile --noconsole `
            --name "Portable_WebDAV_Client_Win7_${{ matrix.platform_name }}" `
            --icon=webdav.ico `
            --add-data "webdav.ico;." `
            --hidden-import=socks `
            portable_webdav_client_Pro.py
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Win7-PyInstaller-${{ matrix.platform_name }}
          path: dist/Portable_WebDAV_Client_Win7_${{ matrix.platform_name }}.exe
          if-no-files-found: error
          retention-days: 14

  # ========== 3. Nuitka 打包（标准版面向 Windows 10+） ==========
  build-nuitka:
    needs: test
    name: Nuitka ${{ matrix.platform_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform_name: Windows_X64
            python_arch: x64
            file_ext: .exe
          - os: windows-latest
            platform_name: Windows_X86
            python_arch: x86
            file_ext: .exe
          - os: ubuntu-24.04
            platform_name: Linux_X64
            python_arch: x64
            file_ext: ""
          - os: ubuntu-24.04-arm
            platform_name: Linux_ARM64
            file_ext: ""

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python (x86/x64)
        if: matrix.platform_name != 'Linux_ARM64'
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          architecture: ${{ matrix.python_arch }}

      - name: Setup Python (ARM64)
        if: matrix.platform_name == 'Linux_ARM64'
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-dev gcc upx-ucl

      - name: Install UPX (Windows)
        if: runner.os == 'Windows'
        run: choco install upx

      - name: Install Python Libraries
        run: |
          python -m pip install --upgrade pip
          pip install nuitka -r requirements.txt

      - name: Build with Nuitka (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m nuitka `
            --onefile `
            --enable-plugin=tk-inter `
            --windows-disable-console `
            --windows-icon-from-ico=webdav.ico `
            --include-data-file=webdav.ico=webdav.ico `
            --include-module=socks `
            --output-dir=dist `
            --output-filename=Portable_WebDAV_Client_Nuitka_${{ matrix.platform_name }} `
            --assume-yes-for-downloads `
            portable_webdav_client_Pro.py

      - name: Build with Nuitka (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m nuitka \
            --onefile \
            --enable-plugin=tk-inter \
            --include-data-file=webdav.ico=webdav.ico \
            --include-module=socks \
            --output-dir=dist \
            --output-filename=Portable_WebDAV_Client_Nuitka_${{ matrix.platform_name }} \
            --assume-yes-for-downloads \
            portable_webdav_client_Pro.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nuitka-${{ matrix.platform_name }}
          path: dist/Portable_WebDAV_Client_Nuitka_${{ matrix.platform_name }}${{ matrix.file_ext }}
          if-no-files-found: error
          retention-days: 14

  # ========== 4. 自动创建 Release 并上传 ==========
  release:
    needs: [build-pyinstaller, build-nuitka, build-win7]
    # 手动触发（非 tag）时只构建并上传 artifacts，不创建 Release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List Artifacts
        run: ls -la artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
